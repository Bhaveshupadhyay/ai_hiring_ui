<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="empty-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <!-- Outer Dotted Circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6" />
  <!-- Folder/Document Background -->
  <rect x="65" y="55" width="70" height="90" rx="12" fill="url(#empty-grad)" stroke="#94A3B8" stroke-width="2" />
  <!-- Folded Page Corner -->
  <path d="M115 55H135V75L115 55Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2" stroke-linejoin="round" />
  <!-- Document Lines -->
  <line x1="80" y1="90" x2="120" y2="90" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="105" x2="110" y2="105" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="120" x2="100" y2="120" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <!-- Small magnifying glass or exclamation -->
  <circle cx="130" cy="130" r="20" fill="#4F46E5" fill-opacity="0.1" stroke="#4F46E5" stroke-width="2" />
  <line x1="144" y1="144" x2="155" y2="155" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" />
  <circle cx="130" cy="130" r="3" fill="#4F46E5" />
</svg>
